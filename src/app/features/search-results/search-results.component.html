<div class="results-page">
  @if (isLoading()) {
    <app-shared-loader message="Buscando los mejores vuelos..." />
  } @else if (error()) {
    <app-shared-error
      [message]="error()!"
      actionLabel="Volver a buscar"
      (action)="goBack()"
    />
  } @else {
    <div class="results-body">
      <app-flight-filters
        [filters]="filters()"
        (filtersChange)="onFiltersChange($event)"
      />

      <app-flight-list [filteredFlights]="filteredFlights()" />
    </div>
  }
</div>
